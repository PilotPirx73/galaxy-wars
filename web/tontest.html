<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galaxy Wars – Ton-Test</title>
<style>
:root{--bg:#05060d;--fg:#e8ecff;--muted:#8a90b0;--p1:#4fd1ff;--p2:#ff6b8b;--line:#262b4a}
body{margin:0;background:var(--bg);color:var(--fg);font:16px ui-monospace,Menlo,Consolas,monospace;display:flex;justify-content:center;padding:24px 16px}
main{max-width:520px;width:100%;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:22px}
p{margin:0;color:var(--muted);line-height:1.5}
button{font:inherit;font-size:17px;padding:14px;border-radius:8px;border:none;cursor:pointer;color:#05060d;font-weight:700}
#a{background:var(--p1)}#b{background:var(--p2)}
pre{background:#0b0e1f;border:1px solid var(--line);border-radius:8px;padding:12px;white-space:pre-wrap;margin:0;min-height:5em;font-size:13px}
</style>
</head>
<body>
<main>
  <h1>🔊 Ton-Test</h1>
  <p>Drück beide Knöpfe nacheinander und sag, bei welchem du einen Ton hörst.</p>
  <button id="a">1 · Web Audio (wie im Spiel)</button>
  <button id="b">2 · Audio-Element (wie YouTube)</button>
  <p>Danach bitte noch diese drei – sie bauen nach, wie das Spiel Töne erzeugt:</p>
  <button id="c" style="background:#ffd24a">3 · Ton mit exponentieller Hüllkurve</button>
  <button id="d" style="background:#5be37a">4 · Wie 3, plus gemeinsamer Lautstärkeregler</button>
  <button id="e" style="background:#c9a4ff">5 · Wie 4, Ton-Kanal schon beim Drücken geöffnet</button>
  <pre id="log"></pre>
</main>
<script>
'use strict';
const log=t=>{document.getElementById('log').textContent+=t+'\n';};
let ctx=null;
document.getElementById('a').onclick=async()=>{
  try{
    if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();
    if(ctx.state!=='running')await ctx.resume();
    const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
    o.type='triangle';o.frequency.value=660;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.3,t+.02);g.gain.linearRampToValueAtTime(0,t+.6);
    o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.65);
    log(`Web Audio: Ton gestartet (Status ${ctx.state}, ${ctx.sampleRate} Hz)`);
  }catch(e){log('Web Audio: Fehler – '+(e&&e.message||e));}
};
// kurzer Ton als WAV-Datei im Speicher, abgespielt über ein normales Audio-Element
function wavBeep(){
  const sr=44100,n=Math.floor(sr*.6),buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){const t=i/sr,env=Math.min(1,t/.02)*Math.max(0,1-t/.6);v.setInt16(44+i*2,Math.sin(2*Math.PI*880*t)*env*.4*32767,true);}
  return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
}
document.getElementById('b').onclick=()=>{
  const a=new Audio(wavBeep());
  a.play().then(()=>log('Audio-Element: Ton gestartet')).catch(e=>log('Audio-Element: Fehler – '+(e&&e.message||e)));
};
// 3: exponentielle Hüllkurve wie im Spiel (eigener Ton-Kanal)
let ctx3=null;
document.getElementById('c').onclick=async()=>{
  try{
    if(!ctx3)ctx3=new(window.AudioContext||window.webkitAudioContext)();
    if(ctx3.state!=='running')await ctx3.resume();
    const t=ctx3.currentTime,o=ctx3.createOscillator(),g=ctx3.createGain();
    o.type='triangle';o.frequency.setValueAtTime(660,t);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+.6);
    o.connect(g);g.connect(ctx3.destination);o.start(t);o.stop(t+.65);
    log(`3: gestartet (Status ${ctx3.state})`);
  }catch(e){log('3: Fehler – '+(e&&e.message||e));}
};
// 4: zusätzlich über einen gemeinsamen Lautstärkeregler (wie SFX.master im Spiel)
let ctx4=null,master4=null;
document.getElementById('d').onclick=async()=>{
  try{
    if(!ctx4){ctx4=new(window.AudioContext||window.webkitAudioContext)();master4=ctx4.createGain();master4.gain.value=.55;master4.connect(ctx4.destination);}
    if(ctx4.state!=='running')await ctx4.resume();
    const t=ctx4.currentTime,o=ctx4.createOscillator(),g=ctx4.createGain();
    o.type='triangle';o.frequency.setValueAtTime(660,t);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.5,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+.6);
    o.connect(g);g.connect(master4);o.start(t);o.stop(t+.65);
    log(`4: gestartet (Status ${ctx4.state})`);
  }catch(e){log('4: Fehler – '+(e&&e.message||e));}
};
// 5: Ton-Kanal wird schon beim Herunterdrücken erzeugt (wie im Spiel), der Ton dann beim Klick
let ctx5=null,master5=null;
document.getElementById('e').addEventListener('pointerdown',()=>{
  if(!ctx5){ctx5=new(window.AudioContext||window.webkitAudioContext)();master5=ctx5.createGain();master5.gain.value=.55;master5.connect(ctx5.destination);log(`5: Kanal beim Drücken erzeugt (Status ${ctx5.state})`);}
  if(ctx5.state==='suspended')ctx5.resume().catch(()=>{});
});
document.getElementById('e').onclick=()=>{
  try{
    if(ctx5.state==='suspended')ctx5.resume().catch(()=>{});
    const t=ctx5.currentTime,o=ctx5.createOscillator(),g=ctx5.createGain();
    o.type='triangle';o.frequency.setValueAtTime(660,t);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.5,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+.6);
    o.connect(g);g.connect(master5);o.start(t);o.stop(t+.65);
    setTimeout(()=>log(`5: gestartet (Status ${ctx5.state})`),100);
  }catch(e){log('5: Fehler – '+(e&&e.message||e));}
};
log('Browser: '+navigator.userAgent.replace(/^Mozilla\/5\.0 /,''));
</script>
</body>
</html>
