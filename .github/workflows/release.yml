name: Desktop-Builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: orbit-duell-macos.zip
          - os: windows-latest
            asset: orbit-duell-windows.zip
          - os: ubuntu-latest
            asset: orbit-duell-linux.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Bibliotheken installieren
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev

      - name: macOS (Universal-App)
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          ./build-mac-app.sh
          ditto -c -k --keepParent "Orbit Duell.app" "../${{ matrix.asset }}"

      - name: Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release
          Compress-Archive -Path target/release/orbit-duell.exe -DestinationPath "../${{ matrix.asset }}"

      - name: Linux
        if: runner.os == 'Linux'
        run: |
          cargo build --release
          tar czf "../${{ matrix.asset }}" -C target/release orbit-duell

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
